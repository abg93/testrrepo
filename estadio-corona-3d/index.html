<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Estadio TSM 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700;800&display=swap" />
  </head>
  <body>
    <div id="map"></div>

    <button id="openPanel" class="chip-btn" hidden>🎟️ Escoger boletos</button>

    <aside id="panel">
      <header>
        <button id="panelToggle" aria-label="Ocultar panel">✕</button>
        <div>
          <h1>Estadio <span>TSM</span> Corona</h1>
          <p class="sub">Territorio Santos Modelo · Torreón · <span id="capacity">—</span> asientos</p>
        </div>
      </header>
      <div class="panel-body">
        <h2>Zonas y precios <small>(de ejemplo, por boleto)</small></h2>
        <ul id="legend"></ul>
        <div class="budget">
          <label for="budget">Mi presupuesto: <b id="budgetLabel"></b></label>
          <input type="range" id="budget" />
          <div id="budgetCount" class="stats"></div>
        </div>
        <button id="vipBtn" class="vip-row">⭐ Palcos VIP <span id="vipFrom"></span></button>
        <h2>Secciones <small>(toca para ir)</small></h2>
        <div class="tier-label">Parte alta · filas R–AF</div>
        <div id="sectionsUpper" class="sections"></div>
        <div class="tier-label">Parte baja · filas A–Q</div>
        <div id="sectionsLower" class="sections"></div>
        <h2>Ver asientos por</h2>
        <div class="seg" role="radiogroup" aria-label="Color de los asientos">
          <label><input type="radio" name="colorMode" id="cmReal" value="real" checked /><span>Real</span></label>
          <label><input type="radio" name="colorMode" id="cmLibre" value="libre" /><span>Libres</span></label>
          <label><input type="radio" name="colorMode" id="cmZona" value="zona" /><span>Zonas</span></label>
          <label><input type="radio" name="colorMode" id="cmSol" value="sol" /><span>Sol</span></label>
        </div>
        <div id="modeStats" class="stats" hidden></div>
        <h2>Capas</h2>
        <label class="toggle"><input type="checkbox" id="optRoof" checked /> Techo</label>
        <label class="toggle"><input type="checkbox" id="optShadows" checked /> Sombras</label>
        <label class="toggle"><input type="checkbox" id="optScenery" checked /> Entorno (estacionamiento, árboles, canchas)</label>
        <button id="resetView" class="ghost">⟲ Vista general</button>
      </div>
    </aside>

    <div id="hovercard" hidden></div>

    <section id="ticketWrap" hidden>
      <div id="ticketPill" class="pill" hidden></div>
      <div id="ticket"></div>
      <div id="ticketActions" class="t-actions"></div>
    </section>

    <div id="toast" role="status" hidden></div>

    <div id="seatview" hidden>
      <canvas id="svCanvas"></canvas>
      <button id="svBack" class="chip-btn">‹ Regresar <kbd>Esc</kbd></button>
      <div class="sv-nav">
        <button id="svPrev" title="Lugar anterior">◀</button>
        <button id="svNext" title="Lugar siguiente">▶</button>
      </div>
    </div>

    <header id="timebar">
      <button id="play" title="Reproducir el día">▶</button>
      <div class="tb-track">
        <div id="kickoff" class="kickoff"><span>SILBATAZO</span></div>
        <div id="matchBand" class="match-band"></div>
        <input type="range" id="time" min="360" max="1380" step="5" aria-label="Hora del día" />
        <div id="ticks" class="ticks"></div>
      </div>
      <div class="tb-clock">
        <output id="timeLabel">--:--</output>
        <label class="tb-date"><span id="dateLabel"></span><input type="date" id="date" aria-label="Fecha" /></label>
      </div>
      <div class="tb-info"><span id="sunAlt"></span><span id="sunTimes"></span></div>
    </header>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
